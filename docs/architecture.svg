<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#595959"/>
    </marker>
  </defs>
  <rect width="1020" height="520" fill="#ffffff"/>
  <text x="510" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Customer MDM pipeline: blocking, three matchers, review, incremental path</text>

  <g font-size="12" text-anchor="middle">
    <!-- row 1 -->
    <rect x="20" y="60" width="130" height="56" rx="6" fill="#F2F2F2" stroke="#8C8C8C"/>
    <text x="85" y="84">CRM · Web · Sales</text><text x="85" y="102" font-size="10" fill="#595959">raw CSVs (synthetic)</text>
    <rect x="180" y="60" width="140" height="56" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="250" y="84" font-weight="bold">Profile + standardize</text><text x="250" y="102" font-size="10" fill="#404040">unfixable = NULL</text>
    <rect x="350" y="60" width="140" height="56" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="420" y="84" font-weight="bold">Blocking</text><text x="420" y="102" font-size="10" fill="#404040">phone · email · name+pincode</text>

    <rect x="520" y="30" width="170" height="36" rx="6" fill="#F2F2F2" stroke="#8C8C8C"/><text x="605" y="53" font-size="11">exact-key rules + name guard</text>
    <rect x="520" y="74" width="170" height="36" rx="6" fill="#F2F2F2" stroke="#8C8C8C"/><text x="605" y="97" font-size="11">fuzzy rules (JW, phonetic key)</text>
    <rect x="520" y="118" width="170" height="36" rx="6" fill="#FFF2CC" stroke="#BF9000"/><text x="605" y="141" font-weight="bold">Fellegi-Sunter (EM m/u)</text>

    <rect x="720" y="74" width="130" height="80" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="785" y="98" font-weight="bold">Decision</text>
    <text x="785" y="116" font-size="10" fill="#404040">auto-merge</text><text x="785" y="130" font-size="10" fill="#404040">human review</text><text x="785" y="144" font-size="10" fill="#404040">non-match</text>

    <rect x="880" y="74" width="120" height="80" rx="6" fill="#E2EFDA" stroke="#548235"/>
    <text x="940" y="98" font-weight="bold">Review queue</text><text x="940" y="116" font-size="10" fill="#404040">ranked by expected</text><text x="940" y="130" font-size="10" fill="#404040">value; reviewer</text><text x="940" y="144" font-size="10" fill="#404040">verdicts</text>

    <!-- row 2 -->
    <rect x="720" y="200" width="130" height="50" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="785" y="222" font-weight="bold">Clusters</text><text x="785" y="238" font-size="10" fill="#404040">connected components</text>
    <rect x="520" y="200" width="170" height="50" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="605" y="222" font-weight="bold">Golden records</text><text x="605" y="238" font-size="10" fill="#404040">survivorship, lineage columns</text>
    <rect x="300" y="200" width="190" height="50" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="395" y="222" font-weight="bold">Validation R1-R6</text><text x="395" y="238" font-size="10" fill="#404040">scorecard + monitoring history</text>
    <rect x="100" y="200" width="170" height="50" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="185" y="222" font-weight="bold">Excel report + outputs</text><text x="185" y="238" font-size="10" fill="#404040">metrics.json, CSVs</text>

    <!-- row 3 -->
    <rect x="260" y="330" width="250" height="56" rx="6" fill="#DDEBF7" stroke="#1F3864"/>
    <text x="385" y="352" font-weight="bold">Evaluation</text><text x="385" y="370" font-size="10" fill="#404040">dev · held-out (frozen config) · 20 seeds · Febrl</text>
    <rect x="260" y="420" width="250" height="40" rx="6" fill="#ffffff" stroke="#8C8C8C" stroke-dasharray="5 4"/>
    <text x="385" y="444">answer keys (evaluation code only)</text>

    <rect x="700" y="330" width="170" height="56" rx="6" fill="#FFF2CC" stroke="#BF9000"/>
    <text x="785" y="352" font-weight="bold">Incremental matcher</text><text x="785" y="370" font-size="10" fill="#404040">frozen weights, touched blocks only</text>
    <rect x="900" y="330" width="100" height="56" rx="6" fill="#F2F2F2" stroke="#8C8C8C"/><text x="950" y="363">New records</text>
  </g>

  <g stroke="#595959" fill="none" marker-end="url(#a)">
    <path d="M150 88 L180 88"/><path d="M320 88 L350 88"/>
    <path d="M490 80 L505 80 L505 48 L520 48"/><path d="M490 92 L520 92"/><path d="M490 100 L505 100 L505 136 L520 136"/>
    <path d="M690 136 L720 124"/><path d="M690 48 L705 48 L705 104 L720 104"/><path d="M690 92 L720 98"/>
    <path d="M850 114 L880 114"/>
    <path d="M785 154 L785 200"/>
    <path d="M720 225 L690 225"/><path d="M520 225 L490 225"/><path d="M300 225 L270 225"/>
    <path d="M900 386 L870 358" stroke-width="0"/>
    <path d="M900 358 L870 358"/>
    <path d="M800 330 L800 250"/>
    <path d="M710 250 L710 308 L385 308 L385 330"/>
  </g>
  <g stroke="#595959" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M940 154 L940 225 L850 225"/>
    <path d="M385 420 L385 386"/>
  </g>
  <text x="20" y="500" font-size="11" fill="#595959">Solid: data flow. Dashed: reviewer verdicts feed clusters; answer keys are read by evaluation only. Yellow: recommended matcher and incremental path.</text>
</svg>
