[project]
name = "customer-master-data-cleanup"
version = "1.0.0"
description = "Synthetic customer master data cleanup, matching and golden record pipeline"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.22", "openpyxl>=3.1", "matplotlib>=3.7"]
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"src/customer_master/reporting.py" = ["E501"]  # long report-text literals
"src/customer_master/validation.py" = ["E501"]  # long SQL / message literals

[tool.coverage.run]
source = ["customer_master"]
omit = ["*/generate_data.py"]
