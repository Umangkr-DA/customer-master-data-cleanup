name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt  # includes the Streamlit app requirements
      - run: ruff check src tests scripts app
      - run: python -m pytest --cov=customer_master --cov-report=term-missing:skip-covered --cov-fail-under=85 -q
      - run: python scripts/run_pipeline.py  # also checks README numbers against generated files
      - name: Pipeline outputs must be reproducible
        run: git diff --exit-code -- outputs/metrics.json outputs/headline_metrics.json outputs/golden_records.csv
      - run: python scripts/monitor_quality.py --run-id ci
